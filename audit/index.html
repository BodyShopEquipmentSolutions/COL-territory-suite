<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0b3d91"/>
<title>Car-O-Liner SW Parts Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0b3d91; --brand-2:#1e64d0; --ok:#0f9d58; --warn:#e0a800; --miss:#d93025;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
a{color:var(--brand-2);text-decoration:none}
header{position:sticky;top:0;background:var(--brand);color:#fff;padding:12px 14px;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header .row{display:flex;align-items:center;gap:10px}
header .title{font-weight:700;font-size:18px;letter-spacing:.2px}
header .sub{font-size:11px;opacity:.85}
main{padding:12px 14px 140px;max-width:1000px;margin:0 auto}
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{font-family:inherit;font-size:16px;padding:12px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(30,100,208,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:10px;border:1px solid transparent;background:var(--brand);color:#fff;font-weight:600;font-size:15px;cursor:pointer;min-height:44px}
.btn:hover{background:#0d4bb0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:#f8fafc}
.btn.warn{background:var(--miss)}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.sm{padding:6px 10px;font-size:13px;min-height:32px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#eef2ff;color:#3730a3}
.chip.ok{background:#e6f4ea;color:var(--ok)}
.chip.miss{background:#fce8e6;color:var(--miss)}
.chip.warn{background:#fef7e0;color:#8a6d02}
.hint{font-size:12px;color:var(--muted);margin:4px 0 10px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.crumbs a{color:var(--brand)}
.crumbs .sep{color:var(--muted)}
.error-banner{background:#fce8e6;color:var(--miss);padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:13px}
.info-banner{background:#e6f0ff;color:var(--brand);padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:13px}
.step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.step-dots .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.step-dots .dot.active{background:var(--brand)}
.step-dots .dot.done{background:var(--ok)}

/* Setup: rep dropdown */
.rep-select{font-size:17px;padding:14px 14px}

/* Setup: customer picker */
.picker-wrap{position:relative}
.picker-suggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;max-height:280px;overflow:auto;z-index:5;box-shadow:0 8px 24px rgba(15,23,42,.12)}
.picker-suggest .item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.picker-suggest .item:last-child{border-bottom:none}
.picker-suggest .item:hover,.picker-suggest .item.hi{background:#f0f6ff}
.picker-suggest .item .name{font-weight:600;font-size:14px}
.picker-suggest .item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.picker-source{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:#e0e7ff;color:#3730a3;margin-left:4px;font-weight:600}
.picker-source.tsuite{background:#fef3c7;color:#92400e}
.picker-loading{padding:12px;text-align:center;color:var(--muted);font-size:13px}
.selected-card{background:#f0f6ff;border:1px solid var(--brand-2);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center}
.selected-card .info{flex:1;min-width:0}
.selected-card .name{font-weight:700;font-size:15px;color:var(--brand)}
.selected-card .meta{font-size:12px;color:var(--muted);margin-top:2px}

/* Setup: equipment checklist */
.bundle-list{list-style:none;padding:0;margin:0}
.bundle-row{display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer;-webkit-user-select:none;user-select:none}
.bundle-row:last-child{border-bottom:none}
.bundle-row .cbwrap{width:28px;height:28px;flex-shrink:0;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fff}
.bundle-row.checked .cbwrap{background:var(--brand);border-color:var(--brand)}
.bundle-row.checked .cbwrap::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg);margin-top:-3px}
.bundle-row .info{flex:1;min-width:0}
.bundle-row .name{font-size:15px;font-weight:600}
.bundle-row .sub{font-size:12px;color:var(--muted)}
.bundle-row .stepper{display:flex;align-items:center;gap:6px}
.bundle-row.checked .stepper{display:flex}
.bundle-row:not(.checked) .stepper{display:none}
.stepper button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:600;cursor:pointer;padding:0;line-height:1}
.stepper .qty{min-width:32px;text-align:center;font-weight:700;font-size:16px}

/* Audit panels */
.panel-nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.panel-nav .tab{flex-shrink:0;padding:8px 14px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:13px;font-weight:600;border:none;cursor:pointer;white-space:nowrap}
.panel-nav .tab.active{background:var(--brand);color:#fff}
.panel-nav .tab.done{background:#e6f4ea;color:var(--ok)}
.panel-nav .tab.done.active{background:var(--ok);color:#fff}

.audit-item{padding:12px 0;border-bottom:1px solid var(--line)}
.audit-item:last-child{border-bottom:none}
.audit-tree{margin-top:8px}
.audit-parent{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:12px;border:1px solid #dbe7fb;border-radius:10px;background:#f7faff;color:var(--ink);cursor:pointer}
.audit-parent:hover{background:#f0f6ff}
.audit-parent .caret{color:var(--brand);font-size:16px;line-height:1.1;flex:0 0 14px;transition:transform .15s ease}
.audit-parent[aria-expanded="true"] .caret{transform:rotate(90deg)}
.audit-parent .info{flex:1;min-width:0}
.audit-parent .pn{font-size:12px;color:var(--brand);font-weight:700}
.audit-parent .desc{font-size:15px;line-height:1.3;font-weight:600}
.audit-parent .subparts{display:block;margin-top:3px;font-size:12px;color:var(--muted);font-weight:500}
.audit-children{margin:0 0 0 16px;padding-left:12px;border-left:3px solid #b7d0fa}
.audit-children[hidden]{display:none}
.audit-item .required-qty{font-size:12px;color:var(--muted);margin-top:3px}
.audit-item .head{display:flex;gap:10px;align-items:flex-start}
.audit-item .thumb, .audit-parent .thumb{flex:0 0 56px;width:56px;height:56px;border-radius:6px;background:#fff;border:1px solid var(--line);object-fit:contain;cursor:zoom-in;padding:2px}
.audit-parent .thumb{width:44px;height:44px;flex-basis:44px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.lightbox .close{position:absolute;top:12px;right:16px;color:#fff;background:transparent;border:0;font-size:32px;cursor:pointer;line-height:1}
.parent-status-row{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap;padding-left:22px}
.parent-status-row .status-btn{font-size:13px;padding:8px 10px}
.audit-parent.roll-present{background:linear-gradient(90deg,rgba(22,163,74,.08),transparent 40%)}
.audit-parent.roll-missing{background:linear-gradient(90deg,rgba(220,38,38,.08),transparent 40%)}
.audit-parent.roll-damaged,.audit-parent.roll-mixed{background:linear-gradient(90deg,rgba(217,119,6,.08),transparent 40%)}
.roll-badge{font-weight:600}
.audit-parent.roll-present .roll-badge{color:#16a34a}
.audit-parent.roll-missing .roll-badge{color:#dc2626}
.audit-parent.roll-damaged .roll-badge,.audit-parent.roll-mixed .roll-badge{color:#d97706}
.audit-item .info{flex:1;min-width:0}
.audit-item .pn{font-size:12px;color:var(--brand);font-weight:600}
.audit-item .desc{font-size:15px;line-height:1.3;font-weight:500}
.status-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.status-btn{flex:1;min-width:80px;padding:10px 8px;border-radius:8px;border:2px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;min-height:44px}
.status-btn.on-present{border-color:var(--ok);background:var(--ok);color:#fff}
.status-btn.on-missing{border-color:var(--miss);background:var(--miss);color:#fff}
.status-btn.on-damaged{border-color:var(--warn);background:var(--warn);color:#fff}
.followup{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.followup .stepper{flex-shrink:0}
.followup .note-toggle{background:none;border:none;color:var(--brand-2);font-size:13px;font-weight:600;cursor:pointer;padding:6px 0}
.note-input{margin-top:8px}
.note-input textarea{font-size:14px;min-height:60px;resize:vertical}

.custom-list{list-style:none;padding:0;margin:8px 0 0}
.custom-list li{padding:8px;background:#fef3c7;border-radius:8px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.custom-list li .info{flex:1;min-width:0}
.custom-list li .pn{font-size:12px;color:#92400e;font-weight:600}
.custom-list li .desc{font-size:14px}
.custom-list li .stepper button{width:30px;height:30px;font-size:16px}
.remove-x{background:none;border:none;color:var(--miss);font-size:20px;cursor:pointer;padding:4px 8px}

/* Modals */
dialog{border:none;border-radius:14px;padding:0;max-width:520px;width:calc(100vw - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh}
dialog::backdrop{background:rgba(15,23,42,.5)}
.dlg-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.dlg-head strong{font-size:16px}
.dlg-body{padding:14px 16px;max-height:60vh;overflow:auto}
.dlg-actions{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-actions .btn{flex:1;min-width:120px}

/* Bottom sticky action bar */
.sticky-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(15,23,42,.08);padding:10px 14px;z-index:30}
.sticky-bar .inner{display:flex;align-items:center;gap:10px;max-width:1000px;margin:0 auto}
.sticky-bar .stat{font-size:13px;font-weight:600}
.sticky-bar .stat span{display:block;font-size:11px;color:var(--muted);font-weight:400}
.sticky-bar .stat.miss{color:var(--miss)}
.sticky-bar .stat.warn{color:#8a6d02}
.sticky-bar .spacer{flex:1}
.sticky-bar .btn{flex-shrink:0}

/* Catalog search modal */
.catalog-results{margin-top:8px}
.catalog-hit{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.catalog-hit:hover{background:#f8fafc}
.catalog-hit:last-child{border-bottom:none}
.catalog-hit .info{flex:1;min-width:0}
.catalog-hit .pn{font-size:12px;color:var(--brand);font-weight:600}
.catalog-hit .desc{font-size:14px}
.catalog-hit .add{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}

@media (min-width:720px){
  .sticky-bar .stat{font-size:14px}
}
@media print{
  header,.sticky-bar,.panel-nav,.crumbs,.no-print{display:none !important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="row">
    <div style="flex:1">
      <div class="title">Car-O-Liner SW Parts Audit</div>
      <div class="sub" id="header-sub">Loading…</div>
    </div>
    <a class="btn ghost" href="../" style="text-decoration:none">← Suite</a>
  </div>
</header>

<main id="app">
  <div class="card"><div class="hint" style="text-align:center;padding:20px">Loading…</div></div>
</main>

<div class="sticky-bar" id="sticky" style="display:none">
  <div class="inner" id="sticky-inner"></div>
</div>

<!-- Add-from-catalog modal -->
<dialog id="catalog-dlg">
  <div class="dlg-head">
    <strong>Add part from catalog</strong>
    <button class="btn sec sm" onclick="closeCatalog()">Close</button>
  </div>
  <div class="dlg-body">
    <input id="catalog-q" placeholder="Search part number or description…" oninput="onCatalogSearch(this.value)"/>
    <div class="hint">Searches the full Car-O-Liner catalog.</div>
    <div class="catalog-results" id="catalog-results"></div>
  </div>
</dialog>

<!-- Quote review modal -->
<dialog id="review-dlg">
  <div class="dlg-head">
    <strong>Review &amp; create quote</strong>
    <button class="btn sec sm" onclick="closeReview()">Close</button>
  </div>
  <div class="dlg-body" id="review-body"></div>
  <div class="dlg-actions">
    <button class="btn sec" onclick="closeReview()">Cancel</button>
    <button class="btn" id="review-confirm" onclick="confirmCreateQuote()">Create Quote in QuoteWerks</button>
  </div>
</dialog>

<script>
// ============================================================================
// State
// ============================================================================
const REPS = [
  'barry.addison','bob.hefty','cody.graves','dylan.alven','geoff.constantine',
  'kayla.curran','kyle.hollingshead','ryan.harthcock','nick.feinman',
  'jeff.horsman','zach.szuba','bri.story','amy.sherrod','james.karol',
  'donnell.tippie'
];
const ROLE_QUEUES = ['<Outside Sales>','<Inside Sales>'];

const LS_REP = 'col_audit_rep';
const IMG_BASE = 'https://cdn3.gung.io/caroliner/images/';
function imgUrl(rel){ if(!rel) return ''; return /^https?:/i.test(rel) ? rel : (IMG_BASE + rel.replace(/^\/+/,'')); }

let BUNDLES = {};        // { bundleName: {name, items:[...], bundle_rec_guid} }
let BUNDLE_NAMES = [];   // ordered
let ASSEMBLIES = [];     // fallback catalog for "add from catalog"
let CONTACTS = [];       // Territory Suite fallback contacts
let PARTS = [];          // parts_index for catalog search (has more items than assemblies)

let state = {
  step: 'rep',           // rep | customer | equipment | audit | success
  rep: '',
  customer: null,        // {id?, company, city, state, phone, email, address?, source: 'qw'|'territory'}
  bundles: {},           // { bundleName: quantity }
  panels: [],            // built when Start Audit is clicked
  activePanel: 0,
  result: null,          // {docNo, docId, quoteUrl, mail}
};

// panels[i] = {
//   bundle_name, unit_number, items: [
//     { partNumber, description, status: 'present'|'missing'|'damaged'|'', qty, note }
//   ],
//   custom: [ { id?, partNumber, description, qty, note } ]
// }

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

// ============================================================================
// Init
// ============================================================================
window.addEventListener('load', init);

async function init(){
  try{
    const [bRes, cRes, aRes, pRes] = await Promise.all([
      fetch('bundles_enriched.json'),
      fetch('../data/contacts.json').catch(()=>null),
      fetch('assemblies.json').catch(()=>null),
      fetch('parts_index.json').catch(()=>null),
    ]);
    BUNDLES = await bRes.json();
    BUNDLE_NAMES = Object.keys(BUNDLES);
    if (cRes && cRes.ok) CONTACTS = await cRes.json();
    if (aRes && aRes.ok) ASSEMBLIES = await aRes.json();
    if (pRes && pRes.ok) PARTS = await pRes.json();

    // Remember rep across sessions
    try { const r = localStorage.getItem(LS_REP); if (r) state.rep = r; } catch(e){}

    $('#header-sub').textContent =
      `${BUNDLE_NAMES.length} bundles · ${CONTACTS.length.toLocaleString()} local contacts`;
    render();
  } catch(err){
    $('#app').innerHTML = `<div class="card"><div class="error-banner">Failed to load audit data: ${escapeHtml(err.message)}</div></div>`;
  }
}

// ============================================================================
// Router / view dispatch
// ============================================================================
function render(){
  const app = $('#app');
  $('#sticky').style.display = 'none';
  switch (state.step){
    case 'rep':       app.innerHTML = viewRep(); afterRep(); break;
    case 'customer':  app.innerHTML = viewCustomer(); afterCustomer(); break;
    case 'equipment': app.innerHTML = viewEquipment(); afterEquipment(); break;
    case 'audit':     app.innerHTML = viewAudit(); afterAudit(); break;
    case 'success':   app.innerHTML = viewSuccess(); break;
  }
}

function stepDots(current){
  const steps = ['rep','customer','equipment','audit'];
  const idx = steps.indexOf(current);
  return `<div class="step-dots">${steps.map((s,i)=>`<div class="dot ${i<idx?'done':i===idx?'active':''}"></div>`).join('')}</div>`;
}

// ============================================================================
// STEP 1 — Rep dropdown
// ============================================================================
function viewRep(){
  const options = [
    '<option value="">— Choose your rep —</option>',
    ...REPS.slice().sort().map(u => `<option value="${u}" ${u===state.rep?'selected':''}>${escapeHtml(prettyRep(u))}</option>`),
    '<optgroup label="Queues">',
    ...ROLE_QUEUES.map(q => `<option value="${escapeHtml(q)}" ${q===state.rep?'selected':''}>${escapeHtml(q)}</option>`),
    '</optgroup>',
  ].join('');
  return `
    ${stepDots('rep')}
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:20px">Who's running this audit?</h2>
      <p class="hint" style="margin-top:0">Pick your name — we'll remember it next time.</p>
      <label for="rep">Sales rep</label>
      <select id="rep" class="rep-select">${options}</select>
      <div style="margin-top:14px;text-align:right">
        <button class="btn" id="rep-next" disabled>Next →</button>
      </div>
    </div>
  `;
}
function afterRep(){
  const sel = $('#rep'), next = $('#rep-next');
  const sync = () => {
    const v = sel.value;
    next.disabled = !v;
    state.rep = v;
    if (v) { try{ localStorage.setItem(LS_REP, v); }catch(e){} }
  };
  sel.addEventListener('change', sync);
  sync();
  next.addEventListener('click', () => { state.step = 'customer'; render(); });
}

// ============================================================================
// STEP 2 — Customer picker (QW search first, contacts.json fallback)
// ============================================================================
function viewCustomer(){
  const has = !!state.customer;
  return `
    ${stepDots('customer')}
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:20px">Which shop?</h2>
      <p class="hint" style="margin-top:0">Search QuoteWerks first. If not found, we'll offer Territory Suite contacts.</p>
      ${has ? `
        <div class="selected-card">
          <div class="info">
            <div class="name">${escapeHtml(state.customer.company)}</div>
            <div class="meta">
              ${[state.customer.city, state.customer.state].filter(Boolean).map(escapeHtml).join(', ')}
              ${state.customer.phone ? ' · ' + escapeHtml(state.customer.phone) : ''}
              <span class="picker-source ${state.customer.source==='territory'?'tsuite':''}">${state.customer.source==='qw'?'QuoteWerks':'Territory Suite'}</span>
            </div>
          </div>
          <button class="btn sec sm" onclick="clearCustomer()">Change</button>
        </div>
      ` : `
        <div class="picker-wrap">
          <label for="cust-q">Company name</label>
          <input id="cust-q" placeholder="Start typing a shop name…" autocomplete="off"/>
          <div class="picker-suggest" id="cust-suggest" style="display:none"></div>
        </div>
        <div class="hint" id="cust-hint">Minimum 2 characters. Live QuoteWerks search.</div>
      `}
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:space-between">
        <button class="btn sec" onclick="state.step='rep';render()">← Back</button>
        <button class="btn" id="cust-next" ${has?'':'disabled'}>Next →</button>
      </div>
    </div>
  `;
}

let custSearchTimer = null;
let custLastQuery = '';
let custQwFailed = false;

function afterCustomer(){
  const next = $('#cust-next');
  if (next) next.addEventListener('click', () => {
    if (!state.customer) return;
    state.step = 'equipment';
    render();
  });
  const q = $('#cust-q');
  if (!q) return;
  q.focus();
  q.addEventListener('input', () => {
    const val = q.value.trim();
    if (val.length < 2) { $('#cust-suggest').style.display = 'none'; return; }
    clearTimeout(custSearchTimer);
    custSearchTimer = setTimeout(() => doCustomerSearch(val), 250);
  });
  document.addEventListener('click', hideSuggestOnOutside);
}
function hideSuggestOnOutside(e){
  const sug = $('#cust-suggest'); const q = $('#cust-q');
  if (!sug || !q) return;
  if (e.target !== q && !sug.contains(e.target)) sug.style.display = 'none';
}
async function doCustomerSearch(query){
  custLastQuery = query;
  const sug = $('#cust-suggest');
  sug.style.display = 'block';
  sug.innerHTML = '<div class="picker-loading">Searching QuoteWerks…</div>';

  let qwResults = [];
  if (!custQwFailed){
    try {
      const res = await fetch('/.netlify/functions/create-qw-quote', {
        method: 'POST',
        headers: {'content-type':'application/json'},
        body: JSON.stringify({ action: 'search_customers', query }),
      });
      const j = await res.json();
      if (j.ok && Array.isArray(j.results)) qwResults = j.results;
      else if (j.error) throw new Error(j.error);
    } catch(err){
      custQwFailed = true;
    }
  }
  if (query !== custLastQuery) return; // stale

  // Local Territory Suite fallback
  const q = query.toLowerCase();
  const localHits = (CONTACTS || [])
    .filter(c => (c.company || '').toLowerCase().includes(q))
    .slice(0, 20);

  const html = [];
  if (qwResults.length){
    html.push('<div style="padding:6px 12px;font-size:11px;font-weight:600;color:var(--brand);background:#f0f6ff">QuoteWerks matches</div>');
    qwResults.forEach((c,i) => {
      html.push(`
        <div class="item" onclick="pickQwCustomer(${i})">
          <div class="name">${escapeHtml(c.name)} <span class="picker-source">QW</span></div>
          <div class="meta">${[c.city, c.state].filter(Boolean).map(escapeHtml).join(', ')}${c.phone ? ' · ' + escapeHtml(c.phone) : ''}</div>
        </div>
      `);
    });
  }
  if (localHits.length){
    html.push(`<div style="padding:6px 12px;font-size:11px;font-weight:600;color:#92400e;background:#fef3c7">Territory Suite contacts${qwResults.length?' (no QW match — use fallback)':''}</div>`);
    localHits.forEach((c,i) => {
      html.push(`
        <div class="item" onclick="pickLocalCustomer(${i})">
          <div class="name">${escapeHtml(c.company)} <span class="picker-source tsuite">Local</span></div>
          <div class="meta">${[c.city, c.state].filter(Boolean).map(escapeHtml).join(', ')}${c.phone && c.phone !== 'nan' ? ' · ' + escapeHtml(c.phone) : ''}</div>
        </div>
      `);
    });
  }
  if (!qwResults.length && !localHits.length){
    html.push(`
      <div class="picker-loading">
        No matches. <a href="#" onclick="pickManualCustomer('${escapeHtml(query).replace(/'/g,"\\'")}');return false">Use "${escapeHtml(query)}" as-is</a>
      </div>
    `);
  }
  sug.innerHTML = html.join('');

  // Stash last search results on window for click handlers
  window._qwHits = qwResults;
  window._localHits = localHits;
  const hint = $('#cust-hint');
  if (hint){
    if (custQwFailed) hint.innerHTML = '<span style="color:var(--warn)">QuoteWerks search unavailable — showing local contacts only.</span>';
    else hint.textContent = `${qwResults.length} QuoteWerks · ${localHits.length} local matches.`;
  }
}
function pickQwCustomer(i){
  const c = (window._qwHits || [])[i]; if (!c) return;
  state.customer = { id: c.id, company: c.name, city: c.city, state: c.state, phone: c.phone, email: '', source: 'qw' };
  render();
}
function pickLocalCustomer(i){
  const c = (window._localHits || [])[i]; if (!c) return;
  const clean = v => (v && v !== 'nan') ? v : '';
  state.customer = {
    company: c.company,
    city: clean(c.city),
    state: clean(c.state),
    phone: clean(c.phone),
    email: clean(c.email),
    address: clean(c.address),
    zip: clean(c.zip),

function pickManualCustomer(name){

function afterEquipment(){/* handlers inline */}
function toggleBundle(name){
  if (state.bundles[name]) delete state.bundles[name];
  else state.bundles[name] = 1;
  render();
}
function stepBundle(name, delta){
  const cur = state.bundles[name] || 0;
  const next = Math.max(1, Math.min(9, cur + delta));
  state.bundles[name] = next;
  render();
}
function auditTreeForItem(item, root, path){
  const children = Array.isArray(item.children) ? item.children.slice(0, 250) : [];
  const node = {
    partNumber: item.partNumber || '',
    description: item.description || '',
    qtyNeeded: Number(item.qty) || 1,
    img: item.img || '',
    path,
    children: [],
  };
  if (children.length){
    node.children = children.map((child, i) => auditTreeForItem(child, root, `${path}/${i}`));
  } else {
    node.auditItem = {
      auditKey: `${root ? root.partNumber : item.partNumber || 'part'}::${path}`,
      partNumber: item.partNumber || '',
      description: item.description || '',
      img: item.img || '',
      status: 'present',
      qty: 1,
      qtyNeeded: Number(item.qty) || 1,
      note: '',
      parentPartNumber: root ? root.partNumber || '' : '',
      parentDescription: root ? root.description || '' : '',
    };
  }
  return node;
}
function collectAuditLeaves(nodes, out=[]){
  nodes.forEach(node => {
    if (node.auditItem) out.push(node.auditItem);
    else collectAuditLeaves(node.children || [], out);
  });
  return out;
}
function bundleAuditStats(bundle){
  const items = (bundle && bundle.items) || [];
  const expanded = items.filter(it => it.expanded === true && (it.children || []).length).length;
  const tree = items.map((it, i) => auditTreeForItem(it, it.expanded === true ? it : null, String(i)));
  return { itemCount: items.length, expandedCount: expanded, auditPoints: collectAuditLeaves(tree).length };
}
function startAudit(){
  // Each panel retains the enriched tree for presentation while items holds only
  // leaf audit points. This keeps statuses keyed to individual BOM parts.
  state.panels = [];
  BUNDLE_NAMES.forEach(name => {
    const qty = state.bundles[name] || 0;
    for (let i=1; i<=qty; i++){
      const tree = BUNDLES[name].items.map((it, idx) => auditTreeForItem(it, it.expanded === true ? it : null, String(idx)));
      state.panels.push({
        bundle_name: name,
        unit_number: i,
        tree,
        items: collectAuditLeaves(tree),
        expanded: {},
        custom: [],
      });
    }
  });
  state.activePanel = 0;
  state.step = 'audit';
  render();
}

function panelSummary(p){
  const miss = p.items.filter(i => i.status === 'missing').length;
  const dmg  = p.items.filter(i => i.status === 'damaged').length;
  const cus  = (p.custom || []).length;
  return { miss, dmg, cus, hasWork: miss + dmg + cus > 0 };
}
function panelDone(p){
  // A panel counts as "audited" once the tech has visited it (opened it at
  // least once). Items default to 'present' so "every item has a status" is
  // true from the start, which would defeat the progress indicator.
  return !!p._visited;
}
function viewAudit(){
  const p = state.panels[state.activePanel];
  p._visited = true;
  const tabs = state.panels.map((pp, i) => {
    const done = panelDone(pp);
    return `<button class="tab ${i===state.activePanel?'active':''} ${done?'done':''}" onclick="jumpPanel(${i})">${escapeHtml(pp.bundle_name)} #${pp.unit_number}${done?' ✓':''}</button>`;
  }).join('');
  const stats = bundleAuditStats(BUNDLES[p.bundle_name]);
  const items = (p.tree || []).map(node => renderAuditNode(node, p, 0)).join('');
  const customs = (p.custom || []).map((c, idx) => renderCustomItem(c, idx)).join('');
  return `
    <div class="crumbs">
      <a href="#" onclick="event.preventDefault();state.step='equipment';render()">← Change equipment</a>
    </div>
    <div class="panel-nav">${tabs}</div>
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:18px">${escapeHtml(p.bundle_name)} — Unit #${p.unit_number}</h2>
      <p class="hint" style="margin-top:0">${stats.itemCount} items · ${stats.expandedCount} with sub-parts · ${stats.auditPoints} audit points total</p>
      <div class="audit-tree">${items}</div>
      ${customs ? `<h3 style="margin:14px 0 6px;font-size:14px;color:#92400e">Custom parts added</h3><ul class="custom-list">${customs}</ul>` : ''}
      <div style="margin-top:14px;text-align:center">
        <button class="btn sec" onclick="openCatalog()">+ Add from catalog</button>
      </div>
    </div>
  `;
}
function nodeRollupStatus(node){
  const leaves = collectAuditLeaves(node.children || []);
  if (!leaves.length) return '';
  const stats = leaves.reduce((a,l)=>{ a[l.status]=(a[l.status]||0)+1; return a; }, {});
  if (stats.present === leaves.length) return 'present';
  if (stats.missing === leaves.length) return 'missing';
  if ((stats.damaged||0) + (stats.missing||0) === leaves.length) return 'damaged';
  if (stats.missing || stats.damaged) return 'mixed';
  return '';
}
function renderAuditNode(node, panel, depth){
  if (node.auditItem) return renderAuditItem(node.auditItem, panel.items.indexOf(node.auditItem), depth);
  const open = !!(panel.expanded && panel.expanded[node.path]);
  const descendants = collectAuditLeaves(node.children || []).length;
  const roll = nodeRollupStatus(node);
  const rollLabel = roll === 'present' ? '✓ All present' : roll === 'missing' ? '✗ All missing' : roll === 'damaged' ? '⚠ All damaged/missing' : roll === 'mixed' ? '● Partial' : '';
  const rollClass = roll ? `roll-${roll}` : '';
  return `
    <div class="audit-branch depth-${depth}">
      <button class="audit-parent ${rollClass}" aria-expanded="${open}" onclick="toggleTree('${escapeHtml(node.path)}')">
        <span class="caret" aria-hidden="true">▸</span>
        ${node.img ? `<img class="thumb" src="${escapeHtml(imgUrl(node.img))}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();showLightbox('${escapeHtml(imgUrl(node.img))}')">` : ''}
        <div class="info"><div class="pn">${escapeHtml(node.partNumber)}</div><div class="desc">${escapeHtml(node.description)}</div><div class="subparts">${descendants} sub-part${descendants===1?'':'s'}${rollLabel ? ` · <span class="roll-badge">${rollLabel}</span>` : ''}</div></div>
      </button>
      <div class="parent-status-row">
        <button class="status-btn ${roll==='present'?'on-present':''}" onclick="setAssemblyStatus('${escapeHtml(node.path)}','present')">Present (whole assembly)</button>
        <button class="status-btn ${roll==='missing'?'on-missing':''}" onclick="setAssemblyStatus('${escapeHtml(node.path)}','missing')">Missing (whole assembly)</button>
        <button class="status-btn" onclick="setAssemblyStatus('${escapeHtml(node.path)}','pick-missing')">Missing (pick sub-parts)</button>
        <button class="status-btn ${roll==='damaged'||roll==='mixed'?'on-damaged':''}" onclick="setAssemblyStatus('${escapeHtml(node.path)}','damaged')">Damaged (pick sub-parts)</button>
      </div>
      <div class="audit-children" ${open ? '' : 'hidden'}>${(node.children || []).map(child => renderAuditNode(child, panel, depth + 1)).join('')}</div>
    </div>`;
}
function findNodeByPath(nodes, path){
  for (const n of nodes){
    if (n.path === path) return n;
    if (n.children && n.children.length){
      const hit = findNodeByPath(n.children, path);
      if (hit) return hit;
    }
  }
  return null;
}
function setAssemblyStatus(path, status){
  const panel = state.panels[state.activePanel];
  const node = findNodeByPath(panel.tree || [], path);
  if (!node) return;
  const leaves = collectAuditLeaves(node.children || []);
  panel.expanded = panel.expanded || {};
  if (status === 'present'){
    leaves.forEach(l => { l.status = 'present'; l.qty = 1; l.note = ''; l.wholeAssembly = false; });
    panel.expanded[path] = false;
  } else if (status === 'missing'){
    // Whole assembly missing — mark each leaf as part of the whole so the
    // server rolls them up into ONE parent SKU line with no sub-part detail.
    leaves.forEach(l => { l.status = 'missing'; l.qty = 1; l.wholeAssembly = true; });
    panel.expanded[path] = false;
  } else if (status === 'damaged' || status === 'pick-missing'){
    // Picking individual sub-parts — clear the whole-assembly flag so
    // detail comments show up on the quote for each flagged leaf.
    leaves.forEach(l => { l.wholeAssembly = false; });
    panel.expanded[path] = true;
  }
  render();
}
function renderAuditItem(it, idx, depth=0){
  const notesOpen = !!it.note || it._noteOpen;
  const needsQty = it.status === 'missing' || it.status === 'damaged';
  const needed = it.qtyNeeded && it.qtyNeeded !== 1 ? `<div class="required-qty">Qty needed: ${escapeHtml(it.qtyNeeded)}</div>` : '';
  return `
    <div class="audit-item" data-idx="${idx}" data-audit-key="${escapeHtml(it.auditKey || it.partNumber)}" style="${depth ? 'margin-left:0' : ''}">
      <div class="head">${it.img ? `<img class="thumb" src="${escapeHtml(imgUrl(it.img))}" alt="" onerror="this.style.display='none'" onclick="showLightbox('${escapeHtml(imgUrl(it.img))}')">` : ''}<div class="info"><div class="pn">${escapeHtml(it.partNumber)}</div><div class="desc">${escapeHtml(it.description)}</div>${needed}</div></div>
      <div class="status-row">
        <button class="status-btn ${it.status==='present'?'on-present':''}" onclick="setItemStatus(${idx},'present')">Present</button>
        <button class="status-btn ${it.status==='missing'?'on-missing':''}" onclick="setItemStatus(${idx},'missing')">Missing</button>
        <button class="status-btn ${it.status==='damaged'?'on-damaged':''}" onclick="setItemStatus(${idx},'damaged')">Damaged</button>
      </div>
      ${needsQty ? `<div class="followup"><div class="stepper"><button onclick="stepItemQty(${idx},-1)">−</button><span class="qty">× ${it.qty}</span><button onclick="stepItemQty(${idx},1)">+</button></div><button class="note-toggle" onclick="toggleNote(${idx})">${notesOpen ? 'Hide note' : '+ Note'}</button></div>${notesOpen ? `<div class="note-input"><textarea placeholder="Optional note (e.g. bent, seized, wrong revision)…" oninput="setItemNote(${idx}, this.value)">${escapeHtml(it.note)}</textarea></div>` : ''}` : ''}
    </div>`;
}
function showLightbox(url){
  if (!url) return;
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `<button class="close" aria-label="Close">&times;</button><img src="${url}" alt="">`;
  box.addEventListener('click', () => box.remove());
  document.body.appendChild(box);
}
function toggleTree(path){

function renderCustomItem(c, idx){

function stepItemQty(idx, delta){

function toggleNote(idx){

}
function setItemNote(idx, v){

function jumpPanel(i){

function openCatalog(){
  const dlg = $('#catalog-dlg');
  // Fill in the placeholder count for the hint (template literal above kept it raw)
  const hint = dlg.querySelector('.hint');
  if (hint){
    const n = (PARTS && PARTS.length) || (ASSEMBLIES && ASSEMBLIES.length) || 0;
    hint.textContent = `Searches ${n.toLocaleString()} catalog parts.`;
  }
  $('#catalog-q').value = '';
  $('#catalog-results').innerHTML = '<div class="picker-loading">Type to search…</div>';
  dlg.showModal();
  setTimeout(()=>$('#catalog-q').focus(), 80);
}
function closeCatalog(){ $('#catalog-dlg').close(); }
function onCatalogSearch(v){
  const q = (v || '').trim().toLowerCase();
  const out = $('#catalog-results');
  if (q.length < 2){ out.innerHTML = '<div class="picker-loading">Type at least 2 characters…</div>'; return; }
  const src = (PARTS && PARTS.length) ? PARTS : ASSEMBLIES;
  const toks = q.split(/\s+/);
  const hits = src.filter(p => {
    const hay = [p.id, p.pop, p.desc, p.itemNumber].filter(Boolean).join(' ').toLowerCase();
    return toks.every(t => hay.includes(t));
  }).slice(0, 60);
  if (!hits.length){ out.innerHTML = '<div class="picker-loading">No matches.</div>'; return; }
  out.innerHTML = hits.map((p,i) => `
    <div class="catalog-hit" onclick="addFromCatalog(${i})">
      <div class="info">
        <div class="pn">${escapeHtml(p.itemNumber || p.id)}${p.pop ? ' · '+escapeHtml(p.pop) : ''}</div>
        <div class="desc">${escapeHtml(p.desc || p.id)}</div>
      </div>
      <button class="add">Add</button>
    </div>
  `).join('');
  window._catHits = hits;
}
function addFromCatalog(i){
  const p = (window._catHits || [])[i]; if (!p) return;
  const panel = state.panels[state.activePanel];
  panel.custom = panel.custom || [];
  panel.custom.push({
    id: p.id,
    partNumber: p.itemNumber || (p.id ? ('CAR' + p.id) : ''),
    description: p.desc || p.id,
    qty: 1,
    note: '',
  });
  closeCatalog();
  render();
}

function quotePreviewGroups(panel){
  const rows = [
    ...(panel.items || []).filter(i => i.status === 'missing' || i.status === 'damaged'),
    ...(panel.custom || []).map(i => ({...i, status:'custom'})),
  ];
  const groups = new Map();
  rows.forEach(row => {
    const pn = row.parentPartNumber || row.partNumber || '';
    const desc = row.parentDescription || row.description || '';
    const key = `${pn}\u0000${desc}`;
    if (!groups.has(key)) groups.set(key, {partNumber: pn, description: desc, children: [], isParent: !!row.parentPartNumber, wholeAssembly: !!row.wholeAssembly});
    groups.get(key).children.push(row);
    if (row.wholeAssembly) groups.get(key).wholeAssembly = true;
  });
  return [...groups.values()];
}
function renderQuotePreview(){
  const panels = state.panels.filter(p => panelSummary(p).hasWork);
  return panels.map(p => {
    const groups = quotePreviewGroups(p);
    return `<div style="margin-top:10px"><div style="font-size:12px;font-weight:700;color:var(--brand)">${escapeHtml(p.bundle_name)} #${p.unit_number}</div>${groups.map(g => `
      <div style="margin:5px 0 0;padding:8px;background:#f8fafc;border-radius:7px"><div style="font-size:13px;font-weight:600">${escapeHtml(g.partNumber)} — ${escapeHtml(g.description)}</div>
      ${g.isParent && g.wholeAssembly ? `<div style="font-size:12px;color:var(--muted);margin-top:3px;font-style:italic">Whole assembly — quoted as one line (× 1)</div>` : ''}
      ${g.isParent && !g.wholeAssembly ? `<div style="font-size:12px;color:var(--muted);margin-top:3px">${g.children.map(c => `• ${escapeHtml(c.partNumber)} (${escapeHtml(c.status)} ${escapeHtml(c.qty || 1)})`).join('<br>')}</div>` : ''}</div>`).join('')}</div>`;
  }).join('');
}
function openReview(){
  const dlg = $('#review-dlg');
  let miss=0, dmg=0, cus=0;
  // Count what will actually hit QuoteWerks: whole-assembly rollups become
  // ONE line each; individual sub-part picks each count as one.
  state.panels.forEach(p => {
    const seenWhole = new Set();
    (p.items || []).forEach(i => {
      if (i.status !== 'missing' && i.status !== 'damaged') return;
      if (i.wholeAssembly && i.parentPartNumber) {
        const key = i.status + '\u0000' + i.parentPartNumber;
        if (seenWhole.has(key)) return;
        seenWhole.add(key);
      }
      if (i.status === 'missing') miss++;
      else if (i.status === 'damaged') dmg++;
    });
    cus += (p.custom || []).length;
  });
  const activePanels = state.panels.filter(p => panelSummary(p).hasWork).length;
  $('#review-body').innerHTML = `
    <div style="margin-bottom:14px">
      <label>Customer</label>
      <div style="font-weight:600;font-size:15px">${escapeHtml(state.customer.company)}</div>
      <div style="font-size:12px;color:var(--muted)">${[state.customer.city, state.customer.state].filter(Boolean).map(escapeHtml).join(', ')}</div>
    </div>
    <div style="margin-bottom:14px">
      <label>Sales rep</label>
      <div style="font-weight:600;font-size:15px">${escapeHtml(prettyRep(state.rep))} <span style="color:var(--muted);font-weight:400;font-size:12px">(${escapeHtml(state.rep)})</span></div>
    </div>
    <div style="margin-bottom:14px">
      <label>Line items</label>
      <div style="font-size:14px">${miss} missing part${miss===1?'':'s'}, ${dmg} damaged part${dmg===1?'':'s'}, ${cus} custom part${cus===1?'':'s'} across ${activePanels} audit panel${activePanels===1?'':'s'}.</div>
    </div>
    <div style="margin-bottom:12px"><label>Quote preview</label>${renderQuotePreview()}</div>
    <div class="info-banner">Creating a quote in QuoteWerks is a real, irreversible action. The rep will receive an email with the quote link.</div>
    <div id="review-error" style="display:none" class="error-banner"></div>
  `;
  dlg.showModal();
}
function closeReview(){ $('#review-dlg').close(); }
async function confirmCreateQuote(){
  const btn = $('#review-confirm');
  const err = $('#review-error');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Creating quote…';
  // Rolling status — tell the user roughly what's happening. Server-side we
  // can't stream progress from Netlify functions, so approximate by elapsed time.
  const t0 = Date.now();
  const statusTimer = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    if (s < 5)       btn.textContent = 'Creating quote…';
    else if (s < 12) btn.textContent = `Adding line items… (${s}s)`;
    else if (s < 22) btn.textContent = `Still working… large quote (${s}s)`;
    else             btn.textContent = `Still working… hang tight (${s}s)`;
  }, 1000);

  // Build payload. Whole-assembly rollups collapse to ONE row for the parent
  // SKU (with the parent description). Individual picks keep their own
  // partNumber + parent link so the server can group them under one parent.
  function toLines(items, status) {
    const flagged = items.filter(i => i.status === status);
    const wholeParents = new Map();
    const picks = [];
    for (const i of flagged) {
      if (i.wholeAssembly && i.parentPartNumber) {
        if (!wholeParents.has(i.parentPartNumber)) {
          wholeParents.set(i.parentPartNumber, {
            partNumber: i.parentPartNumber,
            description: i.parentDescription || i.description || '',
            qty: 1,
            wholeAssembly: true,
          });
        }
      } else {
        picks.push({
          partNumber: i.partNumber,
          description: i.description || '',
          qty: i.qty || 1,
          parentPartNumber: i.parentPartNumber || '',
          parentDescription: i.parentDescription || '',
        });
      }
    }
    return [...wholeParents.values(), ...picks];
  }
  const panels = state.panels
    .filter(p => panelSummary(p).hasWork)
    .map(p => ({
      bundle_name: p.bundle_name,
      unit_number: p.unit_number,
      missing: toLines(p.items, 'missing'),
      damaged: toLines(p.items, 'damaged'),
      custom: (p.custom || []).map(c => ({
        partNumber: c.partNumber || (c.id ? 'CAR' + c.id : ''),
        description: c.description || '',
        qty: c.qty || 1,
      })),
    }));

  // Client timeout — the backend now returns quickly for large quotes
  // (creates the header, fires a background function for line inserts, and
  // returns DocNo immediately). 30s is plenty; anything longer than that
  // is a genuine failure worth surfacing.
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 30000);
  try {
    const res = await fetch('/.netlify/functions/create-qw-quote', {
      method: 'POST',
      headers: {'content-type':'application/json'},
      body: JSON.stringify({
        action: 'create_quote',
        rep: state.rep,
        customer: state.customer,
        panels,
      }),
      signal: controller.signal,
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Quote creation failed');
    state.result = j;
    state.step = 'success';
    closeReview();
    render();
    // If the backend deferred lines + PDF to a background function, start
    // polling quote_status so the success screen updates when everything's done.
    if (j.backgrounded && j.docId) {
      startBackgroundPolling(j.docId);
    }
  } catch(e){
    let msg = e.message;
    if (e.name === 'AbortError') {
      msg = 'The quote is taking longer than 30 seconds. It may still finish in QuoteWerks — check QW for a new quote by ' + escapeHtml(prettyRep(state.rep)) + ' before re-submitting to avoid a duplicate.';
    }
    err.textContent = msg;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Quote in QuoteWerks';
  } finally {
    clearInterval(statusTimer);
    clearTimeout(timeoutId);
  }
}

// ============================================================================
// Background quote polling — kicked off when the backend returns
// { backgrounded: true }. Polls the quote_status action every 4s and re-renders
// the success screen when lines appear + email is sent.
// ============================================================================
let bgPollTimer = null;
let bgPollAttempts = 0;
function startBackgroundPolling(docId){
  clearInterval(bgPollTimer);
  bgPollAttempts = 0;
  bgPollTimer = setInterval(async () => {
    bgPollAttempts += 1;
    // Stop polling after ~5 minutes (75 attempts × 4s) — even huge quotes
    // finish inside that window.
    if (bgPollAttempts > 75) {
      clearInterval(bgPollTimer);
      bgPollTimer = null;
      return;
    }
    try {
      const r = await fetch('/.netlify/functions/create-qw-quote', {
        method: 'POST',
        headers: {'content-type':'application/json'},
        body: JSON.stringify({ action: 'quote_status', docId }),
      });
      const j = await r.json();
      if (!j.ok) return;
      if (!state.result) return;
      state.result.bgStatus = {
        itemCount: j.itemCount || 0,
        grandTotal: j.grandTotal || 0,
      };
      // Consider the quote "done" once the header has a non-zero GrandTotal
      // (means all lines are inserted and QW has priced them up). Emails fire
      // right after the last insert, so this is a reliable done-signal.
      const done = (j.grandTotal || 0) > 0 && (j.itemCount || 0) >= (state.result.itemCount || 1);
      if (done) {
        state.result.backgrounded = false;
        state.result.mail = { sent: true, via: 'qw', backgroundedDone: true };
        clearInterval(bgPollTimer);
        bgPollTimer = null;
      }
      if (state.step === 'success') render();
    } catch { /* ignore transient poll errors */ }
  }, 4000);
}

// ============================================================================
// Success screen
// ============================================================================
function viewSuccess(){
  const r = state.result || {};
  const mail = r.mail || {};
  const qwUrl = r.quoteUrl || (r.docId ? ('https://na.quotewerks.com/#/documents/' + r.docId) : '');

  let statusBlock;
  if (r.backgrounded) {
    // Big quote — lines + PDF are being added by the server.
    const bg = r.bgStatus || {};
    const totalItems = r.itemCount || 0;
    const done = bg.itemCount || 0;
    // Rough ETA: ~0.5s per line + ~30s for QW SendEmail.
    const etaSec = Math.max(45, Math.ceil(totalItems * 0.6) + 35);
    const progressLine = totalItems
      ? `<div class="hint">${done}/${totalItems} lines added${done < totalItems ? ' — still working…' : ''}</div>`
      : '<div class="hint">Building lines and preparing the PDF…</div>';
    statusBlock = `
      <div class="hint" style="margin:6px 0 4px">The quote header is in QuoteWerks. Line inserts and the PDF email are running in the background — expect the email in about ${etaSec} seconds.</div>
      ${progressLine}
    `;
  } else if (mail.backgroundedDone) {
    statusBlock = `<div class="hint">All lines added. PDF email sent from QuoteWerks.</div>`;
  } else if (mail.backgrounded) {
    // Small quote path — lines are already in QW, PDF email is dispatched to
    // background and typically arrives in 30-40 seconds.
    statusBlock = `<div class="hint">PDF email dispatched from QuoteWerks — expect it in about 30-40 seconds.</div>`;
  } else if (mail.sent) {
    statusBlock = `<div class="hint">Email sent to <strong>${escapeHtml(mail.to || '')}</strong>${mail.mapped ? '' : ' <span style="color:var(--warn)">(fallback inbox — rep email not yet mapped)</span>'}.</div>`;
  } else {
    statusBlock = `<div class="hint" style="color:var(--warn)">Email not sent${mail.reason ? ' — ' + escapeHtml(mail.reason) : ''}${mail.error ? ' — ' + escapeHtml(mail.error) : ''}. The quote is still in QuoteWerks.</div>`;
  }

  return `
    <div class="card" style="text-align:center;padding:32px 20px">
      <div style="font-size:44px;line-height:1">✅</div>
      <h2 style="margin:12px 0 4px;font-size:22px">Quote ${escapeHtml(r.docNo || '(pending #)')} created</h2>
      <p class="hint" style="margin-top:0">Nice work — the audit is in QuoteWerks.</p>
      ${statusBlock}
      <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px">
        ${qwUrl ? `<a class="btn" href="${escapeHtml(qwUrl)}" target="_blank" rel="noopener">Open in QuoteWerks Web →</a>` : ''}
        <button class="btn sec" onclick="startAnother()">Start Another Audit</button>
      </div>
    </div>
  `;
}
function startAnother(){
  // Reset everything but keep the rep pick
  const keepRep = state.rep;
  state = {
    step: 'customer', rep: keepRep, customer: null,
    bundles: {}, panels: [], activePanel: 0, result: null,
  };
  render();
}

// ============================================================================
// helpers
// ============================================================================
function prettyRep(u){
  if (!u) return '';
  if (u.startsWith('<') && u.endsWith('>')) return u;
  return u.split('.').map(s => s ? s[0].toUpperCase() + s.slice(1) : s).join(' ');
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
