[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"

# Per-function timeout. Synchronous Netlify functions cap at ~30s at the CDN edge
# regardless of the runtime timeout, so long-running sends are moved to a
# background function (file suffix -background.js) which returns 202 immediately
# and runs asynchronously for up to 15 minutes.
#
# create-qw-quote is capped at 30s in practice: create the QW quote (~500ms) then
# fire-and-forget the background send. No inner-fetch of the email path.
[functions."create-qw-quote"]
  timeout = 30
